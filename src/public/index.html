<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tram Departures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #ffffff;
      --fg:         #1a1a1a;
      --muted:      #888888;
      --green:      #78BE20;
      --green-pale: #f4faea;
      --separator:  #e4e4e4;
      --amber:      #d97706;
      --font:       Arial, Helvetica, system-ui, sans-serif;

      --w: 1024px;
      --h: 576px;

      --header-h: 72px;
      --section-h: 32px;
      --footer-h: 30px;
    }

    html, body {
      width: 100%; height: 100%;
      background: #e0e0e0;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Board shell ─────────────────────────────────────────── */
    #board {
      width: var(--w);
      height: var(--h);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 3px solid var(--green);
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #logo {
      height: 36px;
      width: auto;
      display: none;
    }

    #title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
    }

    #subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    #clock {
      font-size: 2rem;
      font-weight: 300;
      color: var(--fg);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* ── 2×2 grid of stop sections ──────────────────────────── */
    #rows {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 2fr 1fr;
      overflow: hidden;
    }

    .stop-section {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--separator);
      border-bottom: 1px solid var(--separator);
    }

    /* remove right border on right-column cells */
    .stop-section:nth-child(2n) { border-right: none; }
    /* remove bottom border on bottom-row cells */
    .stop-section:nth-child(3),
    .stop-section:nth-child(4) { border-bottom: none; }

    .stop-section-header {
      height: var(--section-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: var(--green-pale);
      border-left: 4px solid var(--green);
      border-bottom: 1px solid var(--separator);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a6e10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Departure rows ─────────────────────────────────────── */
    .dep-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .dep-row {
      flex: 1;
      min-height: 44px;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 0 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--separator);
    }

    .dep-row:last-child { border-bottom: none; }

    .dep-row.empty { opacity: 0.3; }

    /* Route badge */
    .badge {
      width: 46px;
      height: 46px;
      background: var(--green);
      color: #fff;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .dep-row.empty .badge { background: var(--separator); }

    /* Destination */
    .dest {
      font-size: 1.1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg);
    }

    /* Time + minutes group */
    .time-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .mins {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--fg);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mins.due { color: var(--green); }

    .dep-time {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* No data */
    #no-data {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--muted);
    }
    #no-data.visible { display: flex; }

    /* ── Footer ─────────────────────────────────────────────── */
    #footer {
      height: var(--footer-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-top: 1px solid var(--separator);
      font-size: 0.68rem;
      color: var(--muted);
    }

    #updated-at.stale {
      color: var(--amber);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="board">
    <div id="header">
      <div id="header-left">
        <img id="logo" src="" alt="">
        <div>
          <div id="title">Tram Departures</div>
          <div id="subtitle"></div>
        </div>
      </div>
      <div id="clock"></div>
    </div>

    <div id="rows"></div>
    <div id="no-data"><span>No upcoming trams</span></div>

    <div id="footer">
      <span id="updated-at"></span>
      <span>PTV GTFS-RT</span>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
