<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tram Departures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #ffffff;
      --fg:         #1a1a1a;
      --muted:      #888888;
      --green:      #78BE20;
      --green-pale: #f4faea;
      --separator:  #e4e4e4;
      --amber:      #d97706;
      --font:       Arial, Helvetica, system-ui, sans-serif;

      /* Responsive sizing - maintains 576:1024 aspect ratio (9:16) */
      /* Board will scale to fit viewport while maintaining proportions */
      --base-w: 576;
      --base-h: 1024;
      --aspect-ratio: calc(var(--base-w) / var(--base-h));

      /* Calculate dimensions based on viewport, maintaining aspect ratio */
      --w: min(100vw, calc(100vh * var(--aspect-ratio)));
      --h: min(100vh, calc(100vw / var(--aspect-ratio)));

      /* Scale factor for proportional sizing of all elements */
      --scale: calc(var(--w) / var(--base-w));

      /* Proportional heights based on scale */
      --header-h: calc(60px * var(--scale));
      --section-h: calc(36px * var(--scale));
      --footer-h: calc(30px * var(--scale));
    }

    html {
      /* Scale base font size proportionally to board width */
      font-size: calc(16px * var(--scale));
    }

    html, body {
      width: 100%; height: 100%;
      background: #e0e0e0;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Board shell ─────────────────────────────────────────── */
    #board {
      width: var(--w);
      height: var(--h);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 calc(24px * var(--scale));
      border-bottom: calc(3px * var(--scale)) solid var(--green);
    }

    #logo {
      height: calc(32px * var(--scale));
      width: auto;
      margin-right: calc(12px * var(--scale));
      display: none;
    }

    #title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
    }

    /* ── Single-column stop sections ─────────────────────────── */
    #rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .stop-section {
      /* flex-grow set inline by JS proportional to route count */
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: calc(1px * var(--scale)) solid var(--separator);
    }

    .stop-section:last-child { border-bottom: none; }

    .stop-section-header {
      height: var(--section-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 calc(24px * var(--scale));
      background: var(--green-pale);
      border-left: calc(4px * var(--scale)) solid var(--green);
      border-bottom: calc(1px * var(--scale)) solid var(--separator);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a6e10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Departure rows ─────────────────────────────────────── */
    .dep-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .dep-row {
      flex: 1;
      min-height: calc(56px * var(--scale));
      display: grid;
      grid-template-columns: calc(60px * var(--scale)) 1fr auto;
      align-items: center;
      gap: 0 calc(16px * var(--scale));
      padding: 0 calc(24px * var(--scale));
      border-bottom: calc(1px * var(--scale)) solid var(--separator);
    }

    .dep-row:last-child { border-bottom: none; }

    .dep-row.empty { opacity: 0.3; }

    /* Route badge */
    .badge {
      width: calc(52px * var(--scale));
      height: calc(52px * var(--scale));
      background: var(--green);
      color: #fff;
      border-radius: calc(8px * var(--scale));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .dep-row.empty .badge { background: var(--separator); }

    /* Destination */
    .dest {
      font-size: 1.5rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg);
    }

    /* Time + minutes group */
    .time-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: calc(1px * var(--scale));
    }

    .mins {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--fg);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mins.due { color: var(--green); }

    .dep-time {
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* No data */
    #no-data {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--muted);
    }
    #no-data.visible { display: flex; }

    /* ── Footer ─────────────────────────────────────────────── */
    #footer {
      height: var(--footer-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 calc(24px * var(--scale));
      border-top: calc(1px * var(--scale)) solid var(--separator);
      font-size: 0.68rem;
      color: var(--muted);
    }

    #updated-at.stale {
      color: var(--amber);
      font-weight: 600;
    }

    /* ── Scrolling text for overflow ─────────────────────────── */
    @keyframes scroll-text {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Add .scroll class to enable scrolling animation */
    .stop-section-header.scroll,
    .dest.scroll {
      position: relative;
      overflow: hidden;
    }

    .stop-section-header.scroll span,
    .dest.scroll span {
      display: inline-block;
      white-space: nowrap;
      padding-right: 3em;
      animation: scroll-text 15s linear infinite;
      will-change: transform;
    }

    /* Duplicate text for seamless loop using pseudo-element */
    .stop-section-header.scroll span::after,
    .dest.scroll span::after {
      content: attr(data-text);
      padding-left: 3em;
    }

    /* Pause animation on hover for readability */
    .stop-section-header.scroll:hover span,
    .dest.scroll:hover span {
      animation-play-state: paused;
    }

    /* Faster scroll for smaller screens */
    @media (max-width: 400px) {
      .stop-section-header.scroll span,
      .dest.scroll span {
        animation-duration: 10s;
      }
    }
  </style>
</head>
<body>
  <div id="board">
    <div id="header">
      <img id="logo" src="" alt="">
      <div id="title">Tram Departures</div>
    </div>

    <div id="rows"></div>
    <div id="no-data"><span>No upcoming trams</span></div>

    <div id="footer">
      <span id="updated-at"></span>
      <span>PTV GTFS-RT</span>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
