<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tram Departures</title>
  <style>
    *, *::before, *::after {
	  box-sizing: border-box;
	  margin: 0;
	  padding: 0;
	}

	:root {
	  --bg:         #ffffff;
	  --fg:         #1a1a1a;
	  --muted:      #888888;
	  --green:      #78BE20;
	  --green-pale: #f4faea;
	  --separator:  #e4e4e4;
	  --amber:      #d97706;
	  --font:       Helvetica, system-ui, Arial, sans-serif;

	  --w: 100vw;
	  --h: 100vh;

	  /* Fixed header and footer sizes */
	  --header-h: 50px;
	  --footer-h: 20px;
	  
	  /* Stop header variable height */
	  --section-h: clamp(25px, 3vh, 35px);
	  
	  /* Departure row limits */
	  --row-min: 60px;
	  --row-max: 150px;
	}

	html {font-size: 16px;}

	html,
	body {
	  width: 100%;
	  height: 100%;
	  background: #e0e0e0;
	  font-family: var(--font);
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  overflow: hidden;
	}

	/* ── Board shell ─────────────────────────────────────────── */

	#board {
	  width: var(--w);
	  height: var(--h);
	  background: var(--bg);
	  display: flex;
	  flex-direction: column;
	  overflow: hidden;
	  flex-shrink: 0;
	}

	/* ── Header ─────────────────────────────────────────────── */

	#header {
	  height: var(--header-h);
	  flex: 0 0 var(--header-h);
	  display: flex;
	  align-items: center;
	  padding: 0 clamp(16px, 2vw, 32px);
	  border-bottom: 1px solid var(--separator);
	}

	#logo {
	  height: clamp(24px, 3vw, 48px);
	  width: auto;
	  margin-right: clamp(8px, 1.2vw, 16px);
	  display: none;
	}

	#title {
	  font-size: 1.7rem;
	  font-weight: 700;
	  color: var(--fg);
	  line-height: 1;
	}

	/* ── Main scrolling area ───────────────────────────────── */

	#rows {
	  flex: 1 1 auto;
	  min-height: 0;
	  display: flex;
	  flex-direction: column;
	  overflow-y: auto;
	  overflow-x: hidden;
	  position: relative;
	  scroll-behavior: smooth;
	  -ms-overflow-style: none;
	  scrollbar-width: none;
	}

	#rows::-webkit-scrollbar {
	  display: none;
	}

	.stop-section {
	  display: flex;
	  flex-direction: column;
	  flex: 0 0 auto;
	  min-height: 0;
	  border-bottom: 1px solid var(--separator);
	}

	.stop-section:last-child {
	  border-bottom: 1px solid var(--separator);
	}

	/* ── Stop header ────────────────────────────────────────── */

	.stop-section-header {
	  height: var(--section-h);
	  flex: 0 0 var(--section-h);
	  display: flex;
	  align-items: center;
	  padding: 0 clamp(8px, 2vw, 32px);
	  background: var(--green-pale);
	  border-bottom: 1px solid var(--separator);
	  font-size: 0.85rem;
	  font-weight: 700;
	  letter-spacing: 0.08em;
	  color: #4a6e10;
	  white-space: nowrap;
	  overflow: hidden;
	  text-overflow: ellipsis;
	}

	/* ── Departure rows container ──────────────────────────── */

	.dep-rows {
	  display: flex;
	  flex-direction: column;
	}

	/* ── Departure row ─────────────────────────────────────── */

	.dep-row {
	  flex: 0 0 var(--row-height, var(--row-min));
	  height: var(--row-height, var(--row-min));
	  min-height: var(--row-min);
	  max-height: var(--row-max);
	  display: grid;
	  grid-template-columns:
		clamp(48px, 8vw, 64px)
		minmax(0, 1fr)
		auto;
	  align-items: center;
	  gap: 0 clamp(12px, 1vw, 24px);
	  padding: 0 clamp(2px, 2vw, 32px) 0 0;
	  border-bottom: 1px solid var(--separator);
	}

	.dep-row:last-child {
	  border-bottom: none;
	}

	.dep-row.empty {
	  opacity: 0.3;
	}

	/* ── Route badge ────────────────────────────────────────── */

	.badge {
	  width: 100%;
	  height: 100%;
	  background: var(--green);
	  color: #fff;
	  border-radius: 0;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  font-size: clamp(1.5rem, 3vw, 2rem);
	  font-weight: 700;
	  letter-spacing: -0.03em;
	  flex-shrink: 0;
	}

	.dep-row.empty .badge {
	  background: var(--separator);
	}


	/* ── Destination ───────────────────────────────────────── */

	.dest {
	  font-size: clamp(1.25rem, 3vw, 2rem);
	  font-weight: 500;
	  white-space: nowrap;
	  overflow: hidden;
	  text-overflow: ellipsis;
	  color: var(--fg);
	  min-width: 0;
	  max-width: 100%;
	  padding-right: clamp(8px, 1vw, 16px);
	}

	/* ── Time + minutes group ──────────────────────────────── */

	.time-group {
	  display: flex;
	  flex-direction: column;
	  align-items: flex-end;
	  gap: 2px;
	  min-width: clamp(80px, 8vw, 120px);
	  flex-shrink: 0;
	}

	.mins {
	  font-size: 1.7rem;
	  font-weight: 700;
	  color: var(--fg);
	  white-space: nowrap;
	  font-variant-numeric: tabular-nums;
	}

	.mins.due {
	  color: var(--green);
	}

	.dep-time {
	  font-size: 0.9rem;
	  color: var(--muted);
	  white-space: nowrap;
	  font-variant-numeric: tabular-nums;
	}

	/* ── No data ────────────────────────────────────────────── */

	#no-data {
	  display: none;
	  flex: 1;
	  align-items: center;
	  justify-content: center;
	  font-size: 1rem;
	  color: var(--muted);
	}

	#no-data.visible {
	  display: flex;
	}

	/* ── Footer ─────────────────────────────────────────────── */

	#footer {
	  height: var(--footer-h);
	  flex: 0 0 var(--footer-h);
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 clamp(16px, 2vw, 32px);
	  border-top: 1px solid var(--separator);
	  font-size: 0.68rem;
	  color: var(--muted);
	}

	#updated-at.stale {
	  color: var(--amber);
	  font-weight: 600;
	}

	/* ── Scrolling text for overflow ───────────────────────── */

	@keyframes scroll-text {
	  0% {
		transform: translateX(0%);
	  }
	  100% {
		transform: translateX(-50%);
	  }
	}
	.stop-section-header.scroll,
	.dest.scroll {
	  position: relative;
	  overflow: hidden;
	}
	.stop-section-header.scroll span,
	.dest.scroll span {
	  display: inline-block;
	  white-space: nowrap;
	  padding-right: 3em;
	  animation: scroll-text 15s linear infinite;
	  will-change: transform;
	}
	.stop-section-header.scroll span::after,
	.dest.scroll span::after {
	  content: attr(data-text);
	  padding-left: 3em;
	}
	.stop-section-header.scroll:hover span,
	.dest.scroll:hover span {
	  animation-play-state: paused;
	}

	/* Faster scrolling on very narrow screens */

	@media (max-width: 400px) {
	  .stop-section-header.scroll span,
	  .dest.scroll span {
		animation-duration: 10s;
	  }
	}
  </style>
</head>
<body>
  <div id="board">
    <div id="header">
      <img id="logo" src="" alt="">
      <div id="title">Tram Departures</div>
    </div>

    <div id="rows"></div>
    <div id="no-data"><span>No upcoming trams</span></div>

    <div id="footer">
      <span id="updated-at"></span>
      <span>PTV GTFS-RT</span>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
