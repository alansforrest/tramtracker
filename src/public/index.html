<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tram Departures</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #ffffff;
      --fg:         #1a1a1a;
      --muted:      #888888;
      --green:      #78BE20;
      --green-pale: #f4faea;
      --separator:  #e4e4e4;
      --amber:      #d97706;
      --font:       Arial, Helvetica, system-ui, sans-serif;

      /* Responsive sizing - board fills viewport */
      --w: 100vw;
      --h: 100vh;

      /* Fixed heights in vh units for consistent proportions */
      --header-h: 6vh;
      --section-h: 3.5vh;
      --footer-h: 3vh;
    }

    html {
      /* Base font size - minimum 16px for readability */
      font-size: clamp(16px, 2vw, 28px);
    }

    html, body {
      width: 100%; height: 100%;
      background: #e0e0e0;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Board shell ─────────────────────────────────────────── */
    #board {
      width: var(--w);
      height: var(--h);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Header ─────────────────────────────────────────────── */
    #header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 clamp(16px, 2vw, 32px);
      border-bottom: clamp(2px, 0.3vw, 4px) solid var(--green);
    }

    #logo {
      height: clamp(24px, 3vw, 48px);
      width: auto;
      margin-right: clamp(8px, 1.2vw, 16px);
      display: none;
    }

    #title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--fg);
      line-height: 1;
    }

    /* ── Single-column stop sections ─────────────────────────── */
    #rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Auto-scroll when content overflows */
    #rows.auto-scroll {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #rows.auto-scroll::-webkit-scrollbar {
      display: none; /* Hide scrollbar for cleaner look */
    }

    #rows.auto-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .stop-section {
      /* flex-grow set inline by JS proportional to route count */
      display: flex;
      flex-direction: column;
      flex-shrink: 0; /* Don't shrink sections - let container scroll */
      min-height: fit-content; /* Size to fit content */
      border-bottom: 1px solid var(--separator);
    }

    .stop-section:last-child { border-bottom: none; }

    .stop-section-header {
      height: var(--section-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 clamp(16px, 2vw, 32px);
      background: var(--green-pale);
      border-left: clamp(3px, 0.4vw, 6px) solid var(--green);
      border-bottom: 1px solid var(--separator);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a6e10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Departure rows ─────────────────────────────────────── */
    .dep-rows {
      flex: 0 0 auto; /* Don't grow, size to content */
      display: flex;
      flex-direction: column;
    }

    .dep-row {
      flex: 0 0 auto; /* Don't grow or shrink, maintain fixed height */
      height: clamp(70px, 8vh, 110px); /* Fixed height - won't compress below 70px */
      min-height: 70px; /* Absolute minimum height */
      display: grid;
      grid-template-columns: clamp(48px, 5.5vw, 72px) minmax(0, 1fr) minmax(clamp(80px, 8vw, 120px), auto);
      align-items: center;
      gap: 0 clamp(12px, 1.5vw, 24px);
      padding: 0 clamp(16px, 2vw, 32px);
      border-bottom: 1px solid var(--separator);
    }

    .dep-row:last-child { border-bottom: none; }

    .dep-row.empty { opacity: 0.3; }

    /* Route badge */
    .badge {
      width: clamp(48px, 5.5vw, 72px);
      height: clamp(48px, 5.5vw, 72px);
      background: var(--green);
      color: #fff;
      border-radius: clamp(6px, 0.8vw, 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }

    .dep-row.empty .badge { background: var(--separator); }

    /* Destination */
    .dest {
      font-size: 1.5rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg);
      min-width: 0; /* Allows grid item to shrink below content size */
      max-width: 100%; /* Never exceed grid column width */
      padding-right: clamp(8px, 1vw, 16px); /* Safety gap before time column */
    }

    /* Time + minutes group */
    .time-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: clamp(80px, 8vw, 120px); /* Reserve space for time */
      flex-shrink: 0; /* Never shrink the time column */
    }

    .mins {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--fg);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .mins.due { color: var(--green); }

    .dep-time {
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* No data */
    #no-data {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--muted);
    }
    #no-data.visible { display: flex; }

    /* ── Footer ─────────────────────────────────────────────── */
    #footer {
      height: var(--footer-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 2vw, 32px);
      border-top: 1px solid var(--separator);
      font-size: 0.68rem;
      color: var(--muted);
    }

    #updated-at.stale {
      color: var(--amber);
      font-weight: 600;
    }

    /* ── Scrolling text for overflow ─────────────────────────── */
    @keyframes scroll-text {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Add .scroll class to enable scrolling animation */
    .stop-section-header.scroll,
    .dest.scroll {
      position: relative;
      overflow: hidden;
    }

    .stop-section-header.scroll span,
    .dest.scroll span {
      display: inline-block;
      white-space: nowrap;
      padding-right: 3em;
      animation: scroll-text 15s linear infinite;
      will-change: transform;
    }

    /* Duplicate text for seamless loop using pseudo-element */
    .stop-section-header.scroll span::after,
    .dest.scroll span::after {
      content: attr(data-text);
      padding-left: 3em;
    }

    /* Pause animation on hover for readability */
    .stop-section-header.scroll:hover span,
    .dest.scroll:hover span {
      animation-play-state: paused;
    }

    /* Faster scroll for smaller screens */
    @media (max-width: 400px) {
      .stop-section-header.scroll span,
      .dest.scroll span {
        animation-duration: 10s;
      }
    }
  </style>
</head>
<body>
  <div id="board">
    <div id="header">
      <img id="logo" src="" alt="">
      <div id="title">Tram Departures</div>
    </div>

    <div id="rows"></div>
    <div id="no-data"><span>No upcoming trams</span></div>

    <div id="footer">
      <span id="updated-at"></span>
      <span>PTV GTFS-RT</span>
    </div>
  </div>
  <script src="board.js"></script>
</body>
</html>
